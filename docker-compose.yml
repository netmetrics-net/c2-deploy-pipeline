version: '3.8'

services:
  telemetry-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=INFO
      - SYNC_INTERVAL=15
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
